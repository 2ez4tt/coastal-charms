# ══════════════════════════════════════════════════════════════
#  The Coastal Charms — editor configuration
#
#  This is wired up and live. Nothing here needs changing unless
#  the repo moves or the DecapBridge site is recreated.
#  See SETUP-CMS.md in the folder above.
# ══════════════════════════════════════════════════════════════

backend:
  name: git-gateway
  repo: 2ez4tt/coastal-charms
  branch: main

  # DecapBridge PKCE login — the shop owner signs in with an email
  # and password (or Google / Microsoft) and never needs a GitHub
  # account. These values come from the DecapBridge dashboard.
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/b4e969cc-b9c9-415e-a883-5b51a82dc192/pkce
  auth_token_endpoint: /sites/b4e969cc-b9c9-415e-a883-5b51a82dc192/token
  gateway_url: https://gateway.decapbridge.com

  # Records who made each change in the repo history.
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Names and avatars for logged-in editors.
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Where uploaded photos are stored in the repo, and how the
# site refers to them once published.
media_folder: "images/uploads"
public_folder: "images/uploads"

# "View site" link inside the editor.
site_url: https://the-coastal-charms.netlify.app

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Interface language
locale: en

# Editing goes live immediately (no draft/review workflow —
# simpler for a one-person shop).
publish_mode: simple

collections:
  # ════════════════════════════════════════════════════════════
  #  THE SHOP — one file, three sections
  # ════════════════════════════════════════════════════════════
  - name: "shop"
    label: "Your shop"
    files:
      # ── 1 · Products ────────────────────────────────────────
      - name: "products"
        label: "Products"
        file: "shop.json"
        description: "Add, edit, reorder or remove the pieces you sell."
        format: "json"
        fields:
          - label: "Settings"
            name: "settings"
            widget: "object"
            collapsed: true
            fields:
              - label: "WhatsApp number"
                name: "whatsapp"
                widget: "string"
                required: false
                default: ""
                pattern: ["^$|^92[0-9]{10}$|^0[0-9]{10}$", "Pakistani mobile number. Best format: 923365236845 (92, then the number without its leading 0). Typing 03365236845 also works."]
                hint: "Write it as 92 followed by your number without the leading zero — 0336 5236845 becomes 923365236845"

              - label: "Instagram username"
                name: "instagram"
                widget: "string"
                default: "thecoastalcharms_"
                hint: "Without the @ symbol"

              - label: "Currency label"
                name: "currency"
                widget: "string"
                default: "Rs"

              - label: "Notice line"
                name: "notice"
                widget: "string"
                required: false
                hint: "Small line at the top of the shop. Leave empty to hide it."

              - label: "Tagline under the shop name"
                name: "tagline"
                widget: "text"

              - label: "Closing line at the bottom"
                name: "closing_line"
                widget: "string"

              - label: "Story — first paragraph"
                name: "story_1"
                widget: "text"

              - label: "Story — second paragraph"
                name: "story_2"
                widget: "text"

          - label: "Categories"
            name: "categories"
            widget: "list"
            collapsed: true
            label_singular: "Category"
            hint: "The filter buttons across the top. Each product must use one of these names."
            fields:
              - label: "Name"
                name: "name"
                widget: "string"

          - label: "Products"
            name: "products"
            widget: "list"
            label_singular: "Product"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
                hint: "What the piece is called"

              - label: "Price"
                name: "price"
                widget: "number"
                value_type: "int"
                min: 0
                hint: "Numbers only — no Rs, no commas"

              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - "Bracelets"
                  - "Bag charms"
                  - "Phone straps"
                  - "Keyrings"
                hint: "Pick which filter this piece appears under. To add a new option here, edit admin/config.yml."

              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
                allow_multiple: false
                media_library:
                  config:
                    max_file_size: 3000000
                hint: "Tap to upload from your phone. Portrait photos look best."

              - label: "Short note"
                name: "note"
                widget: "string"
                required: false
                hint: "One line — materials, length, colour. Optional."

              - label: "Sold out"
                name: "sold"
                widget: "boolean"
                default: false
                hint: "Turn on to mark this piece as sold"
